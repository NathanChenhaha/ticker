<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>榮譽榜</title>
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  * { box-sizing: border-box; }
  :root { --page: #ffffff; --paper: #fffdf5; --dot: #e8e1cf; --ink: #4a3f35; --ink-soft: #8a7d6e; }
  @media (prefers-color-scheme: dark) { :root { --page: #191919; } }
  html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; }
  body { font-family: "LXGW WenKai TC", "PingFang TC", "Microsoft JhengHei", sans-serif; color: var(--ink); padding: 7px 8px; }

  a.bar {
    position: relative; display: flex; align-items: center; gap: 14px; height: 100%; min-height: 46px; padding: 0 18px 0 12px;
    border-radius: 10px; color: var(--ink); text-decoration: none; overflow: visible;
    background-color: var(--paper);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 16px 16px;
  }
  a.bar:hover { background-color: #fff8e1; }
  svg.deco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

  .label { position: relative; flex: none; font-weight: 700; font-size: 17px; padding: 6px 14px; z-index: 1; display: flex; align-items: center; gap: 4px; }
  .label #labelBg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: -1; }
  .cup { width: 28px; height: 26px; flex: none; overflow: visible; }

  .viewport { position: relative; flex: 1; height: 100%; overflow: hidden; }
  .item { position: absolute; inset: 0; display: flex; align-items: center; gap: 9px; font-size: 18px; white-space: nowrap;
    transition: transform .5s ease, opacity .5s ease; }
  .item.in   { transform: translateY(0);     opacity: 1; }
  .item.down { transform: translateY(100%);  opacity: 0; }
  .item.up   { transform: translateY(-100%); opacity: 0; }
  .medal { width: 24px; height: 28px; flex: none; overflow: visible; }
  .title { overflow: hidden; text-overflow: ellipsis; font-weight: 700; flex: 0 1 auto; min-width: 0; }
  .who { flex: none; font-size: 17px; }
  .who::before { content: '— '; color: var(--ink-soft); }
  .tag { flex: none; font-size: 15px; padding: 0 4px;
    background: linear-gradient(transparent 30%, var(--mk) 30%, var(--mk) 88%, transparent 88%); }
  .date { flex: none; font-size: 15px; color: var(--ink-soft); }

  .more { position: relative; flex: none; font-size: 16px; font-weight: 700; padding-bottom: 4px; }
  .more svg { position: absolute; left: 0; bottom: -2px; width: 100%; height: 10px; overflow: visible; }

  @media (max-width: 620px) { .date, .tag { display: none; } }
  @media (max-width: 520px) {
    .more { display: none; }
    .item { font-size: 16px; } .who { font-size: 15px; } .label { font-size: 15px; padding: 5px 10px; }
  }
</style>
</head>
<body>
  <a class="bar" id="bar" href="#">
    <svg class="deco" id="frame"></svg>
    <span class="label" id="label"><svg id="labelBg"></svg><svg class="cup" id="cup" viewBox="0 0 28 26"></svg>榮譽榜</span>
    <div class="viewport" id="vp"><div class="item in"><span class="title">擦亮獎盃中…</span></div></div>
    <span class="more" id="more">看全部 ›<svg id="moreLine"></svg></span>
  </a>

<script>
  // 「看全部」連到的頁面：可換成發布後的 notion.site 網址
  const HONOR_URL = "https://www.notion.so/41e2dfee609581f1a555fb72dace59cf";
  const API = "https://script.google.com/macros/s/AKfycbx3aOZR4hNGWYoxNswA_JaSoQTq4S6nRQVVDPy_Ze05wUfZkpZI3Y_HoBzoHwAuzqPL/exec?view=honor-json";
  const SECONDS = 4;
  const INK = '#4a3f35';
  const MARKERS = ['#fde047', '#93c5fd', '#86efac', '#fdba74', '#c4b5fd', '#f9a8d4', '#fca5a5'];
  const MEDAL = { '金牌': '#facc15', '銀牌': '#cbd5e1', '銅牌': '#f59e0b', '佳作': '#93c5fd', '其他': '#86efac' };
  const RIBBON = { '金牌': '#ef4444', '銀牌': '#3b82f6', '銅牌': '#22c55e', '佳作': '#a78bfa', '其他': '#f472b6' };
  document.getElementById('bar').href = HONOR_URL;

  const $ = id => document.getElementById(id);
  const vp = $('vp');
  let items = [], data = [], idx = 0, paused = false, seed = 3;

  function markerFor(name) { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return MARKERS[h % MARKERS.length]; }
  function el(tag, cls, text) { const e = document.createElement(tag); e.className = cls; e.textContent = text; return e; }
  function svgEl(cls, w, h) { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', cls); s.setAttribute('viewBox', '0 0 ' + w + ' ' + h); return s; }

  // ---------- 手繪線條 ----------
  function clear(s) { while (s.firstChild) s.removeChild(s.firstChild); }
  function opts(x) { return Object.assign({ stroke: INK, strokeWidth: 1.4, roughness: 1.5, bowing: 1.2, seed: seed++ }, x || {}); }

  // 手繪獎牌：兩條緞帶＋一個圓牌
  function drawMedal(s, kind) {
    clear(s); const g = rough.svg(s); const rib = RIBBON[kind] || RIBBON['其他'];
    s.appendChild(g.polygon([[5, 1], [10, 1], [14, 12], [10, 13]], opts({ fill: rib, fillStyle: 'solid', strokeWidth: 1, roughness: 0.8 })));
    s.appendChild(g.polygon([[19, 1], [14, 1], [10, 12], [14, 13]], opts({ fill: rib, fillStyle: 'solid', strokeWidth: 1, roughness: 0.8 })));
    s.appendChild(g.circle(12, 19, 15, opts({ fill: MEDAL[kind] || MEDAL['其他'], fillStyle: 'hachure', hachureGap: 2.6, fillWeight: 1.1, strokeWidth: 1.3, roughness: 1 })));
    s.appendChild(g.circle(12, 19, 7, opts({ strokeWidth: 0.9, roughness: 0.8 })));
  }

  function draw() {
    seed = 3;
    let s = $('frame'), r = s.getBoundingClientRect(); clear(s);
    s.appendChild(rough.svg(s).rectangle(3, 3, r.width - 6, r.height - 6, opts({ strokeWidth: 1.8, roughness: 1.8 })));
    s = $('labelBg'); r = s.getBoundingClientRect(); clear(s);
    s.appendChild(rough.svg(s).rectangle(1, 1, r.width - 2, r.height - 2,
      opts({ fill: '#fde68a', fillStyle: 'hachure', hachureGap: 7, fillWeight: 0.8, hachureAngle: -40, strokeWidth: 1.5 })));
    // 手繪獎盃
    s = $('cup'); clear(s); const g = rough.svg(s);
    s.appendChild(g.path('M7 3 H21 V9 C21 14 17 17 14 17 C11 17 7 14 7 9 Z',
      opts({ fill: '#facc15', fillStyle: 'hachure', hachureGap: 2.6, fillWeight: 1, strokeWidth: 1.4, roughness: 1 })));
    s.appendChild(g.arc(7, 8, 8, 8, Math.PI / 2, Math.PI * 3 / 2, false, opts({ strokeWidth: 1.3, roughness: 0.7 })));
    s.appendChild(g.arc(21, 8, 8, 8, -Math.PI / 2, Math.PI / 2, false, opts({ strokeWidth: 1.3, roughness: 0.7 })));
    s.appendChild(g.line(14, 17, 14, 21, opts({ strokeWidth: 1.5, roughness: 0.6 })));
    s.appendChild(g.rectangle(9, 21, 10, 3.5, opts({ fill: '#fdba74', fillStyle: 'solid', strokeWidth: 1.2, roughness: 0.8 })));
    s = $('moreLine'); r = s.getBoundingClientRect(); clear(s);
    s.appendChild(rough.svg(s).curve([[0, 5], [r.width * .4, 2], [r.width, 6]], opts({ stroke: '#f59e0b', strokeWidth: 2 })));
    items.forEach((d, i) => { const m = d.querySelector('svg.medal'); if (m) drawMedal(m, data[i].medal); });
  }

  // ---------- 輪播 ----------
  function makeItem(h) {
    const d = document.createElement('div'); d.className = 'item down';
    d.appendChild(svgEl('medal', 24, 28));
    d.appendChild(el('span', 'title', h.title));
    if (h.student) d.appendChild(el('span', 'who', h.student));
    if (h.tag) { const t = el('span', 'tag', h.tag); t.style.setProperty('--mk', markerFor(h.tag)); d.appendChild(t); }
    if (h.date) { const p = h.date.split('-'); d.appendChild(el('span', 'date', (+p[1]) + '/' + (+p[2]))); }
    return d;
  }
  function show(list) {
    vp.innerHTML = '';
    if (!list.length) { vp.appendChild(el('div', 'item in', '榮譽榜等你來寫下第一筆 ✨')); return; }
    data = list; items = list.map(makeItem);
    items.forEach(d => vp.appendChild(d));
    items[0].className = 'item in';
    requestAnimationFrame(draw);
    if (items.length > 1) setInterval(next, SECONDS * 1000);
  }
  function next() {
    if (paused) return;
    const cur = items[idx]; idx = (idx + 1) % items.length; const nxt = items[idx];
    nxt.style.transition = 'none'; nxt.className = 'item down'; void nxt.offsetWidth; nxt.style.transition = '';
    cur.className = 'item up'; nxt.className = 'item in';
  }
  vp.addEventListener('mouseenter', () => paused = true);
  vp.addEventListener('mouseleave', () => paused = false);

  new ResizeObserver(() => requestAnimationFrame(draw)).observe($('bar'));
  document.fonts && document.fonts.ready.then(() => requestAnimationFrame(draw));

  // 預覽用：網址加 ?demo 會顯示範例資料
  if (location.search.indexOf('demo') >= 0) {
    show([{ title: '全國科展 數學科 第一名', student: '928 王小明', medal: '金牌', tag: '科學', date: '2026-11-20' },
          { title: '數學能力競賽 佳作', student: '927 陳小安', medal: '佳作', tag: '數學', date: '2026-11-02' }]);
  } else {
    fetch(API)
      .then(r => r.json())
      .then(d => { if (d.ok) show(d.honors); else throw new Error(d.error); })
      .catch(err => { vp.innerHTML = ''; vp.appendChild(el('div', 'item in', '⚠️ 榮譽榜載入失敗，請稍後再試')); console.error(err); });
  }
</script>
</body>
</html>
